# Dockerfile text is inlined (see notes) so `docker compose up --build` works from any Windows terminal.
# NOTE: identical to backend/Dockerfile. It is inlined here because Docker Compose v5 / buildx 0.37 on Windows fails to
# build a *Dockerfile file* when the shell's drive letter is lowercase (e:\ instead of E:\, common in VS Code terminals):
# "additional privileges requested ... --allow=fs.read". Inline Dockerfiles avoid that. Keep both copies in sync.
x-backend-build: &backend-build
  context: ./backend
  dockerfile_inline: |
    FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
    WORKDIR /src

    # Restore first so this layer is cached until a csproj changes.
    COPY SchoolAdmission.sln ./
    COPY src/SchoolAdmission.Api/SchoolAdmission.Api.csproj src/SchoolAdmission.Api/
    COPY tests/SchoolAdmission.Tests/SchoolAdmission.Tests.csproj tests/SchoolAdmission.Tests/
    RUN dotnet restore src/SchoolAdmission.Api/SchoolAdmission.Api.csproj

    COPY src/ src/
    RUN dotnet publish src/SchoolAdmission.Api/SchoolAdmission.Api.csproj -c Release -o /app --no-restore

    FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS runtime
    WORKDIR /app
    COPY --from=build /app ./

    ENV ASPNETCORE_URLS=http://+:8080
    EXPOSE 8080
    ENTRYPOINT ["dotnet", "SchoolAdmission.Api.dll"]

# NOTE: identical to frontend/Dockerfile. It is inlined here because Docker Compose v5 / buildx 0.37 on Windows fails to
# build a *Dockerfile file* when the shell's drive letter is lowercase (e:\ instead of E:\, common in VS Code terminals):
# "additional privileges requested ... --allow=fs.read". Inline Dockerfiles avoid that. Keep both copies in sync.
x-frontend-build: &frontend-build
  context: ./frontend
  dockerfile_inline: |
    # ---- build stage -------------------------------------------------------------
    FROM node:20-alpine AS build
    WORKDIR /app
    COPY package.json package-lock.json ./
    RUN npm ci --no-audit --no-fund
    COPY . .
    RUN npm run build

    # ---- runtime stage -----------------------------------------------------------
    FROM nginx:1.27-alpine
    COPY nginx.conf /etc/nginx/conf.d/default.conf
    COPY --from=build /app/dist /usr/share/nginx/html

    # Entry script that generates config.js from API_URL at container start.
    # The sed strips CRLF line endings (e.g. a Windows checkout) which would otherwise break the
    # shebang with "exec ... no such file or directory".
    COPY docker-entrypoint.sh /docker-entrypoint.d/40-runtime-config.sh
    RUN sed -i 's/\r$$//' /docker-entrypoint.d/40-runtime-config.sh \
     && chmod +x /docker-entrypoint.d/40-runtime-config.sh

    ENV API_URL=http://localhost:8080
    EXPOSE 80

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_pw
    # The test-suite opens many connections at once (parallel test classes, 2 app instances).
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      # Named volume: data survives `docker compose down` (only `down -v` wipes it).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: *backend-build
    image: school-admission-backend
    environment:
      # Database connection is configured purely through the environment.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=school_admission;Username=school;Password=school_pw"
      # How long a seat hold lasts before the seat is released (seconds).
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: *frontend-build
    environment:
      # Backend URL as seen from the user's BROWSER (not from inside Docker). Written to config.js at start.
      API_URL: "${API_URL:-http://localhost:8080}"
    ports:
      # Open http://localhost:3000. Set FRONTEND_PORT if 3000 is already used on your machine.
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Backend test-suite. Not started by `docker compose up` (profile "tests").
  # Run with:  docker compose run --rm backend-tests
  # Each test class creates and drops its own throw-away database (sa_test_*) on the compose
  # Postgres server, so your real school_admission data is never touched.
  backend-tests:
    profiles: ["tests"]
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /src
    volumes:
      - ./backend:/src
      - nuget_cache:/root/.nuget/packages
    environment:
      TEST_DB_ADMIN: "Host=db;Port=5432;Username=school;Password=school_pw;Database=postgres"
    depends_on:
      db:
        condition: service_healthy
    command: ["dotnet", "test", "SchoolAdmission.sln", "--nologo", "-v", "minimal", "--logger", "console;verbosity=normal"]

  # ---------------------------------------------------------------------------
  # Optional services, only started when their profile is requested.
  # ---------------------------------------------------------------------------

  # Frontend unit tests (Vitest) + type-check:  docker compose run --rm frontend-tests
  frontend-tests:
    profiles: ["tests"]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # keep Linux packages away from a Windows/macOS node_modules
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run typecheck && npm test"]

  # Browser end-to-end test:  docker compose run --rm frontend-e2e
  # Uses its own backend with a 30 s hold so "expiry without reload" can be tested. Same Postgres server.
  backend-e2e:
    profiles: ["e2e"]
    build: *backend-build
    image: school-admission-backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=school_admission;Username=school;Password=school_pw"
      HOLD_DURATION_SECONDS: "30"
    depends_on:
      db:
        condition: service_healthy

  frontend-e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.48.0-jammy
    working_dir: /work
    volumes:
      - ./frontend/e2e:/work
      - e2e_node_modules:/work/node_modules
    environment:
      APP_URL: "http://frontend:80"
      API_TO: "http://backend-e2e:8080"
    depends_on:
      - frontend
      - backend-e2e
    command: ["sh", "-c", "npm ci --no-audit --no-fund && node e2e.mjs"]

  # Two backend processes on ONE database:  docker compose --profile scale run --rm two-backend-proof
  # Second instance is also published on http://localhost:8081 for manual poking.
  backend2:
    profiles: ["scale"]
    build: *backend-build
    image: school-admission-backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=school_admission;Username=school;Password=school_pw"
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  two-backend-proof:
    profiles: ["scale"]
    image: node:20-alpine
    working_dir: /proof
    volumes:
      - ./scripts:/proof:ro
    environment:
      BACKEND_URLS: "http://backend:8080,http://backend2:8080"
    depends_on:
      - backend
      - backend2
    command: ["node", "two-backend-proof.mjs"]

volumes:
  pgdata:
  nuget_cache:
  frontend_node_modules:
  e2e_node_modules:
