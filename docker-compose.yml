services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_pw
    volumes:
      # Named volume: data survives `docker compose down` (only `down -v` wipes it).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      # Database connection is configured purely through the environment.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=school_admission;Username=school;Password=school_pw"
      # How long a seat hold lasts before the seat is released (seconds).
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
